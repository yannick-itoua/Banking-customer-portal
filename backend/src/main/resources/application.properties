# Application Name
spring.application.name=banking-customer-portal

# Database Configuration for Railway
# Railway start.sh script will set these from DATABASE_URL, fallback to local for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:banking_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnly123456789012345678901234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=8080

# Logging
logging.level.com.bankingcustomer.portal=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Disable problematic system metrics in Railway container environment
management.metrics.enable.system.cpu=false
management.metrics.enable.process.cpu=false
management.metrics.enable.process.uptime=false
management.metrics.enable.process.start.time=false
management.metrics.enable.process.files=false
